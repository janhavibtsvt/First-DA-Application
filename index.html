    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('theme');
          if (storedTheme === 'dark' || (!storedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var storedColor = localStorage.getItem('theme_color') || 'indigo';
          document.documentElement.setAttribute('data-theme-color', storedColor);
        } catch (e) {}
      })();
    </script>
